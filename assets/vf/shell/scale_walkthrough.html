:root { color-scheme: light dark; --bg-primary: #ffffff; --bg-grouped: #f3f4f6; --bg-elevated: #ffffff; --bg-fill: #f3f4f6; --bg-fill-strong: #e5e7eb; --text-primary: #0a0a0a; --text-secondary: #4a5565; --text-tertiary: #626a79; --text-on-tint: #ffffff; --tint-primary: #0a0a0a; --border-default: #e5e7eb; --border-strong: #858a93; --accent-gold: #fdc700; --accent-gold-text: #8a6a00; --accent-gold-bg: #fff8db; --status-success: #1a7f37; --status-success-bg: #dcfce7; --status-warning: #9a5b00; --status-warning-bg: #fff4e0; --status-danger: #c62828; --status-danger-bg: #fdecec; --status-info: #0b63ce; --status-info-bg: #e8f1fd; --scrim: rgba(0, 0, 0, .3); --glass-hairline: rgba(255, 255, 255, .55); --glass-shadow: 0 4px 20px rgba(0, 0, 0, .08); --page-outside: #d9dce1; --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; --font-display: "Playfair Display", Georgia, serif; --space-4: 4px; --space-8: 8px; --space-12: 12px; --space-16: 16px; --space-20: 20px; --space-24: 24px; --space-32: 32px; --space-40: 40px; --radius-8: 8px; --radius-12: 12px; --radius-16: 16px; --radius-22: 22px; --radius-28: 28px; --radius-full: 999px; --tabbar-height: 62px; --tabbar-bottom: 26px; --clearance: 140px; --column: 430px; --dur-push: .3s; --dur-sheet: .35s; --dur-alert: .2s; }
*, ::before, ::after { box-sizing: border-box; }
html { font-size: 17px; text-size-adjust: 100%; }
@supports (font: -apple-system-body) {
  html { }
}
body { margin: 0px; font-family: var(--font-ui); font-size: 1rem; line-height: 1.294; letter-spacing: -0.025em; color: var(--text-primary); background: var(--page-outside); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }
h1, h2, h3, p { margin: 0px; }
ul, ol { margin: 0px; padding: 0px; list-style: none; }
button, input, textarea, select { font: inherit; color: inherit; letter-spacing: inherit; }
button { background: none; border: 0px; padding: 0px; cursor: pointer; text-align: inherit; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--tint-primary); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0px; overflow: hidden; clip: rect(0px, 0px, 0px, 0px); white-space: nowrap; border: 0px; }
.sroot { min-height: calc(var(--vh) * 100); }
.app { position: relative; max-width: var(--column); min-height: calc(var(--vh) * 100); margin: 0px auto; background: var(--bg-grouped); overflow-x: clip; }
.fixed-col { position: fixed; left: max(0px,calc(50% - var(--column) / 2)); right: max(0px,calc(50% - var(--column) / 2)); }
.screen { min-height: calc(var(--vh) * 100); padding: calc(max(env(safe-area-inset-top),10px) + 62px) 16px var(--clearance); scroll-padding-bottom: var(--clearance); }
.screen--plain { background: var(--bg-primary); }
.screen--no-nav { padding-top: calc(max(env(safe-area-inset-top),10px) + 20px); }
.screen--fit { display: flex; flex-direction: column; }
.screen-enter-fwd { animation: pushIn var(--dur-push) ease-out; }
.screen-enter-back { animation: popIn var(--dur-push) ease-out; }
@keyframes pushIn { 
  0% { transform: translate(28%); opacity: 0.4; }
}
@keyframes popIn { 
  0% { transform: translate(-16%); opacity: 0.6; }
}
@keyframes fadeIn { 
  0% { opacity: 0; }
}
.stack { display: flex; flex-direction: column; gap: 24px; }

.stack-16 { display: flex; flex-direction: column; gap: 16px; }

.wrap { flex-wrap: wrap; }
.spread { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.grow { flex: 1 1 auto; min-width: 0px; }
.center { text-align: center; }

.c-secondary { color: var(--text-secondary); }
.c-tertiary { color: var(--text-tertiary); }
.c-success { color: var(--status-success); }

.c-danger { color: var(--status-danger); }
.c-info { color: var(--status-info); }
.semibold { font-weight: 600; }
.tabular { font-variant-numeric: tabular-nums; }
.strike { text-decoration: line-through; }

.title-block { display: flex; flex-direction: column; gap: 6px; }

.navbar > * { pointer-events: auto; }

.navbar__lead { justify-self: start; }
.navbar__trail { justify-self: end; display: flex; gap: 8px; }

.header-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; }
.tabbar { z-index: 25; bottom: calc(var(--tabbar-bottom) + env(safe-area-inset-bottom) * .4); margin: 0px 14px; height: var(--tabbar-height); border-radius: var(--radius-full); padding: 0px 8px; display: flex; align-items: center; justify-content: space-between; }

.bottombar__row { display: flex; gap: 12px; }

.bottombar__note { font-size: 0.765rem; line-height: 1.385; color: var(--text-secondary); }
.btn { min-height: 50px; padding: 0px 20px; border-radius: var(--radius-full); font-weight: 600; font-size: 1rem; line-height: 1.294; display: inline-flex; align-items: center; justify-content: center; gap: 8px; position: relative; width: 100%; text-align: center; transition: opacity 0.12s; }
.btn--auto { width: auto; }
.btn--small { min-height: 44px; padding: 0px 18px; }

.btn--filled { background: var(--tint-primary); color: var(--text-on-tint); }
.btn--gray { background: var(--bg-fill-strong); color: var(--text-primary); }
.btn--gray-elevated { background: var(--bg-elevated); color: var(--text-primary); }
.btn--plain { background: transparent; color: var(--text-primary); }
.btn--destructive { background: var(--status-danger-bg); color: var(--status-danger); }

(function(){
var SN=JSON.parse(document.getElementById('sn').textContent);
var RM=matchMedia('(prefers-reduced-motion: reduce)').matches, EMB=(function(){try{return window!==top}catch(e){return true}})();

function scr(n){if(S[n])return S[n];var d=document.createElement('div');d.className='scr';d.setAttribute('data-s',n);
  d.innerHTML='<div class="sc">'+SN[n]+'</div>';vp.appendChild(d);
  d.querySelectorAll('a,button,input').forEach(function(e){e.setAttribute('tabindex','-1')});S[n]=d;return d;}
Object.keys(SN).forEach(scr);
function fit(){var s=Math.min(innerWidth*0.94/412,innerHeight*0.94/866);stage.style.transform='scale('+s+')';}
addEventListener('resize',fit);fit();
document.documentElement.setAttribute('aria-hidden','true');

/* ---- clock: everything is driven by play time T, so pause freezes every motion ---- */
var T=0,playing=false,last=0,raf=0,Q=[],TW=[],qi=0,LOOP=0;

function tick(now){raf=0;if(!playing)return;var dt=Math.min(now-last,50);last=now;T+=dt;run();if(playing)raf=requestAnimationFrame(tick);}
function run(){while(qi<Q.length&&Q[qi].t<=T){Q[qi].f();qi++;}
  for(var i=0;i<TW.length;i++){var w=TW[i],p=Math.max(0,Math.min(1,(T-w.t)/w.d));if(!w.i&&w.s){w.s();w.i=1}w.f(w.e(p));if(p>=1){TW.splice(i,1);i--;}}

  c+=540;

  tw(c,420,function(p){rip.style.transform='translate('+TP[0]+'px,'+(TP[1]+47)+'px) scale('+(1+1.1*p)+')';rip.style.opacity=(1-p)*.9;},E.o);
  tw(c,160,function(p){place(TP[0],TP[1],1,.82+.18*p);},E.o);

  var lim=Math.max.apply(null,[].map.call(S[n].querySelectorAll('.bottombar,.tabbar'),function(e){return 797-(e.getBoundingClientRect().top-vp.getBoundingClientRect().top)/(vp.getBoundingClientRect().width/390)}).concat([0]));
  var over=t[3]-(797-lim-24);b=a+Math.max(0,over);});c+=ms;}
function push(a,b){at(c,function(){show(b);setScroll(b,0);stripFor(b);});
  tw(c,300,function(p){S[b].style.transform='translateX('+(28*(1-p))+'%)';S[b].style.opacity=.4+.6*p;S[a].style.transform='translateX('+(-16*p)+'%)';},E.o);

  tw(c,ms,function(p){S[b].style.opacity=p;},E.io);c+=ms;at(c,function(){hide(a);S[b].style.zIndex='';stripFor(b);});}

  at(0,function(){Object.keys(S).forEach(hide);show('discover');setScroll('discover',0);stripFor('discover');sbdim.style.opacity=0;
    tap.style.opacity=0;rip.style.opacity=0;place(TP[0],TP[1],0);

  at(c,function(){sbdim.style.opacity=0;});push('pay','booked');

  tapOn('today',null);swap('today','sched0');

  tapFade(400);hold(150);
  /* back to the opening state */
  fade('sched1','discover',600);hold(100);
  LOOP=c;Q.forEach(function(q,i){q.i=i});Q.sort(function(a,b){return a.t-b.t||a.i-b.i});}
