/* HANDOFF — VFINAL (theme: dark; full package: X/vfinal_handoff/)
VFINAL LOADING — refined from OM1M's loading (ADDENDUM 1): indeterminate, breathing, never delaying access.
SCULPTURE  12 sheets (180 su), J01A/OM1M FORMS, tilt −14deg, perspective 1400, scale 0.64 centred 195/330; edge 2.58 su;
           industry tints (dark): none var(--neu), hlt var(--acc), fin #A9B4BA, dev #C6BE97, mkt #D8B98C, edu #C9A79B, ai var(--ink).
TIMELINE   one CSS track per sheet (vl0–vl11, 24600ms, fill both) + one group track (vexc), all cubic-bezier(.45,0,.2,1):
           0–600ms stack at rest; then per industry in chip order (Healthcare → Finance → Developer tools → Marketplace →
           Education → AI-generated work): morph out 1600ms → hold 900ms → back to the stack 1500ms (4000ms per form).
           Per-sheet stagger 70ms (bottom → top, 0–770ms). Group excursion ±16–20deg Y, ±5–7deg X, scale 1.05 at each form.
BREATHING  aura: fade in 1600ms to .30, then sine breathing .30 ↔ .60 (period 5600ms, ease-in-out alternate).
           Sequential illumination: each sheet's tint glaze 0 ↔ .26 opacity of a 30% tint (period 5600ms), offset 120ms per sheet
           bottom → top. Max frame-to-frame luminance change measured < 1% (no flashes; cap well below 10%).
TEXT (r2)  ALWAYS VISIBLE: name (Latin + Odia lang="or"), both loader lines (stacked: “Accessing Sarthak’s workspace…” over
           “Preparing the workspace…”), the progress bar and the → control are painted at opacity 1 at their final positions from the
           first frame to the hand-off — no fade, no rise, no swap (r1's nameIn and the l1/l2 line swap are removed). Current step =
           colour only (300ms): line 1 ink while p < .5, then line 2 ink; the other line stays secondary ink (both ≥ 4.5:1).
           Text layer z-index 2 above the sculpture, aura and glaze (none of which reach the text area at any width).
PROGRESS   bar under the two lines, same width as the line block (flex), centred on the → control's axis
           (block padding-bottom 21px; the → keeps its r1 position). Track 1px var(--ctl) (≥3:1), fill 2px var(--acc) = p × width.
           role="progressbar" aria-labelledby the two lines, aria-valuemin 0 / max 100, aria-valuenow = round(min(p, b)·100) (r3: = the displayed fill); indeterminate:
           no aria-valuenow + aria-busy. Before the first value: slow sweep (24% terracotta segment, 2600ms (.45,0,.55,1) infinite),
           present in the markup so it shows from frame 0; the first value fades it out (500ms) while the fill grows.
           SOURCES (same contract as VFINAL2 Loading r2), max-merged, monotonic, never parks at 99%: (a) app-owned window 'pf:progress'
           (detail 0–1, null = indeterminate) / window.pfProgress set before mount — replaces (b); (b) page-measured: readyState +
           every FontFace in use + every image, re-measured on readystatechange / load / capture load·error / fonts events;
           (c) 'pf:ready' / pfReady() = 1. p = 1 → the graceful finish at the 7.6s cap (r3; was: at once). A value lower than the current one is ignored.
POWER-ON   one registered variable --p (0–1) on .root, transition 200ms + 500ms × Δp cubic-bezier(.4,0,.2,1) (no rAF):
           sculpture (.ldc: sheets, glaze, orbit, marker) filter saturate(calc(.25 + .75 * p)) brightness(calc(.5 + .5 * p));
           bar fill filter saturate(calc(.35 + .65 * p)) brightness(calc(.7 + .3 * p)). At p = 1 both filters are removed ([data-p1]) → the settle
           state and the hand-off frame are the r1 frames pixel for pixel. Morph choreography, timings and breathing unchanged.
FINISH     (r3) at the cap 7600ms — content ready (p = 1) no longer finishes early; a slow load still finishes at the cap: every sheet eases from where it is to the stack in
           1000ms (+15ms × k) — the current morph is finished, never snapped — aura fades out (on the cap the bar glides to 100% in the same 1000ms); then data-done (hand-off).
           Worst case total 8765ms; typical (r3): cap 7.6s + ≤1.2s.
SKIP       click / tap anywhere (whole-screen link), → control (44×44, aria-label “Start here”, focused on load), Enter / Space /
           Escape: settle state at once (p = 1, bar full), hand-off now.
HAND-OFF r3 (MOBILE_FOLD_P0; from m-r2, which stays untouched): ONE CANVAS MODEL + the r5 sculpture box (m9v "r5 sculpture box rule
           (FINAL)", FP-VF-2-Landing(-light)-m-r5). The Morph settles EXACTLY into the r5 Landing's sculpture pose:
           pivot (.jg origin) x = vw/2, y = (bandTop + bandBottom)/2 + ey; bandTop = sat + 44 + hp + 5.7·hf + sg + 26.1 + vm;
           bandBottom = vb − sab − 24 − 56 − am; hf = clamp(30px, 9.3cqw, 40px) (≤ 32 at ≤600 tall); scale .64 × eh × ew on the whole box
           (.ldc) about the jg. Brackets by visible height: >760 eh 1 / ey −30, normal spacing (hp 24, sg 16, vm 24, am 24);
           ≤760 .85 / −26; ≤700 .7 / −21 compact (16 / 8 / 16 / 16); ≤639 .56 / −17 (r5c: 640 stays .7); ew .85 below 360 wide.
           Phones: sat = max(env(top), 16), sab = max(env(bottom), 0), vb = min(100svh, 844); fluid root ≤480 wide.
           CANVAS (data-canvas="true": x-dc present AND framed, set on the first render — size-independent, as r5; this 390×844 board =
           iPhone 15/16 screen; a real top-level page, full-screen 390×844 included, uses the real rule): status bar 0–59, Safari visible area 59–723 (390×664), toolbar + home
           indicator 723–844. Laid out as real Safari 390×664 offset by 59: sat 75, sab 0, vb 723, compact, eh .7, ey −21 →
           pivot 195/488.41, scale .448 (= real 390×664 195/429.41 + 59). Name block top sat + 40 (115); lines + bar + → bottom at
           723 − 48 (675); nothing of the Loading below 723. Phones ≤640 tall: lines block bottom 24.
           During the load the box sits 186.41 px × scale above the pivot at the same scale; the settle (1000ms, same easing, with the
           sheets) glides it straight down — monotonic — while sheet stroke → 1.4px on screen, fill → rgba(ink,.06), orbit → 1.2px at
           rgba(ink,.30), glaze → 0. At data-done the frame equals the r5 first frame's sculpture (rest pose, turn 0, settle stack); the
           Loading type leaves in 120ms; r5 fades only its type in. Stack stroke colour at the settle = the r5 Landing's static stack
           colour (rgb(143,138,130)), with motion and with reduced motion (r3e, verification F4). Skip / reduced motion: the r5 pose at once (reduced motion: from
           the first frame).
HAND-OFF   the settle state = the Landing emblem's starting state (neutral stack, tint var(--neu), tilt −14deg, turn 0, orbit hairline,
           marker at the key light). Production route: the sculpture box moves/scales to the Landing emblem — centre 313/145,
           scale 0.145 — 600ms cubic-bezier(.6,0,.2,1) while text and ground cross-fade 300ms. Same ground token as the Landing: no jump.
PERF       CSS animations only (compositor: transform/opacity, border-colour on 12 sheets); no rAF; one timer (cap); paused in a hidden tab.
REDUCED MOTION static settled stack at full look (no power-on filter) with a gentle static glaze (.14) and aura .45; name + both lines +
           bar visible; bar shows real values in steps (indeterminate = static dashed track, no sweep); hand-off on ready (or 400ms).
LOOP (r4, canvas only: framed x-dc AND motion allowed -> .root[data-loop]): the Loading never hands off on the canvas. It plays
           the full 24.6s track (rest + all six forms, Healthcare -> AI-generated work) and, when the group track (vexc) ends with
           the sheets back in the stack, restarts the six forms, the bar (bld, 24.6s) and the ramp from 0 with no reset, so it loops
           seamlessly. CYCLE RAMP: one registered variable --lu (0-1), 24.6s, held at 0 over the rest, rising slowly
           (cubic-bezier(.3,0,.6,1)) to 1 as the sixth form opens (22.2s), then easing back to 0 (cubic-bezier(.45,0,.55,1)) through its hold and the final
           return to the stack (2.4s) so the restart has no jump. --lu drives the sculpture filter saturate x(1 + .6 lu) and
           brightness x(1 + .32 lu) on top of the power-on, and a warm terracotta glow inside the aura (opacity = lu). Per-frame
           luminance change stays under 1%. Name + Odia, both loader lines, the bar and the arrow stay visible throughout. Skip on the
           canvas lands the settle state, holds 1.2s, then replays from frame 0. Scroll-out/in replay is unchanged. Reduced motion:
           unchanged (static settled state, no loop). Production: omit the data-loop block; the Loading runs once per visit.
REDUCED MOTION (m-r7, canvas only): the 400ms reduced-motion hand-off no longer clears the type on the canvas: name + Odia, both lines,
           the bar (full) and the arrow stay visible and static ([data-cv][data-done] .lt/.go opacity 1). Production unchanged.
SEAM (rev b, canvas loop only): bar fill fades out over the last 240ms of each pass and restarts empty at full opacity; line emphasis
           cross-fades line 2 -> line 1 over the same 240ms (data-xf). Sheet / group seam unchanged (exact).
REDUCED MOTION (rev b, canvas only): the static stack stays in the load/seam pose (translate --ly, scale --ek), clear of the loader
           lines; production still settles into the Landing box (--ty).
CANVAS     this board has no app loading, so the bar shows the page's own resources honestly — usually complete within ~0.5s,
           so on the canvas the finish follows at the 7.6s cap (r3, as r1); replay on view (r3, canvas only). Production: the app drives 'pf:progress' / 'pf:ready'.
*/

/* GLASS-GRID platform (OM2R card material): ground var(--surf), 14px grid at 5%, 1px edge, corner ticks, scan on the inspected one */
.dk{position:relative;background-color:var(--surf);background-image:linear-gradient(rgba(var(--hl),.05) 1px,transparent 1px),linear-gradient(90deg,rgba(var(--hl),.05) 1px,transparent 1px);background-size:14px 14px;background-position:-1px -1px}

.scan{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.scan::after{content:"";position:absolute;left:0;right:0;top:-170px;height:170px;background:linear-gradient(180deg,rgba(var(--hl),0),rgba(var(--hl),.065) 50%,rgba(var(--hl),0));filter:blur(6px);animation:scan 7.5s linear infinite;animation-delay:var(--sd,0s)}
.t-light .scan::after{background:linear-gradient(180deg,rgba(255,255,255,0),rgba(255,255,255,.42) 50%,rgba(255,255,255,0))}
.dk:hover .scan::after,.dk:focus-within .scan::after{animation-play-state:paused}
@keyframes scan{from{transform:translateY(0)}to{transform:translateY(calc(100% + var(--sh2,600px) + 170px))}}
.root.pz *,.root.pz *::after,.root.pz *::before{animation-play-state:paused!important}

/* sequential illumination: a soft tint glaze on each sheet, sine-like (ease-in-out alternate), small amplitude, travelling
   bottom -> top with a 120ms offset per sheet; never above 30% of the industry tint at 26% opacity (no flash, no bloom) */

/* breathing aura: one soft radial glow behind the sculpture; sine breathing (5.6s period) between .30 and .60 */

 opacity:0;animation:auraIn 1600ms cubic-bezier(.45,0,.2,1) both,breathe 2800ms cubic-bezier(.45,0,.55,1) 1600ms infinite alternate}

@property --p{syntax:'<number>';inherits:true;initial-value:0}

/* ---------- r3 · PHONES + ONE CANVAS MODEL (mobile board only; MOBILE_FOLD_P0): fluid root = the visible viewport; the Morph runs and
   settles in the r5 Landing's sculpture box (m9v "r5 sculpture box rule (FINAL)"): pivot = the .jg origin, x = vw/2,
   y = (bandTop + bandBottom)/2 + ey, bandTop = sat + 44 + hp + 5.7·hf + sg + 26.1 + vm, bandBottom = vb − sab − 24 − 56 − am;
   total scale .64 × eh × ew on the WHOLE box (.ldc, perspective-origin at the jg) about the jg. Canvas ([data-canvas="true"]) =
   real Safari 390×664 offset by the 59px status bar: sat 75, sab 0, vb 723, compact spacing, eh .7, ey −21 → 195/488.41 ×.448. ---------- */
@media (max-width:480px){.root{width:100%!important;height:100vh!important;height:100svh!important}}

   visible web area 59–723, compact toolbar + home indicator 723–844 (nothing of the Loading below 723). Keyed by the shared
   size-independent check (x-dc present AND framed → data-canvas="true", set on the first render; same as FP-VF-2-Landing-m-r5);
   a real top-level page (data-canvas="false"), full-screen 390×844 included, uses the real r5 rule. */
.root[data-canvas="true"]{--sat:max(env(safe-area-inset-top),75px);--sab:max(env(safe-area-inset-bottom),0px);--vb:723px;--ob:121px;--hp:16px;--sg:8px;--vm:16px;--am:16px;--eh:.7;--ey:-21px}
