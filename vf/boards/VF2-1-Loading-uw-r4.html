/* ---------- LOADING CHOREOGRAPHY (pure CSS keyframes; base styles = the stable configuration; every track animates FROM the ground
   with fill-mode backwards, so finishing / skipping / reduced motion all land on the same final frame) ---------- */

/* CRT holographic layer — restrained: scan lines .028 alpha, two localized light sweeps, two soft flickers (≤5% opacity), one rare
   small glitch (3px, 70ms) and one 2px/50ms echo. Measured frame-to-frame luminance change < 10%. */

  -webkit-mask-image:radial-gradient(closest-side,#000 60%,transparent 100%);mask-image:radial-gradient(closest-side,#000 60%,transparent 100%)}

  animation:swp 1700ms linear 1300ms 2 both}

/* ---------- r2 · POWER-ON — one registered variable --p (0–1) = displayed loading progress. JS sets it on .root (event-driven, no rAF);
   a CSS transition on --p glides every change (duration 200ms + 500ms × step, cubic-bezier(.4,0,.2,1)). Everything below reads it. ---------- */

   rebuilt with it; initial 1 = stable configuration, so reduced motion and finished builds read 1). Visible fill = min(--p, --b). */

  }
