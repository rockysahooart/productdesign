<!-- WHO THIS IS, IN THE ONE FORMAT A SEARCH ENGINE READS WITHOUT GUESSING.

     "Sarthak Sahoo" returns dozens of people. Nothing on a page of pictures
     and prose tells a crawler which of them made it, so the same facts the
     footer already states are repeated here in the vocabulary built for the
     question: the name, what the work is called, and the profiles that are
     demonstrably the same person. sameAs is the load-bearing line - it is
     how an identity on this domain gets tied to one that already has
     standing elsewhere.

     Nothing here is a claim the site does not already make in words. -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": "Sarthak Sahoo",
  "alternateName": "Rocky Sahoo",
  "url": "https://www.rockysahoo.space/",
  "jobTitle": "Product Designer",
  "description": "Product designer working across healthcare, biotechnology, financial services, developer tools, and complex systems.",
  "sameAs": [
    "https://www.linkedin.com/in/sarthakrockysahoo/",
    "https://www.instagram.com/rockysahoo.art/",
    "https://rockysahoo.design/"
  ],
  "mainEntityOfPage": {
    "@type": "WebSite",
    "@id": "https://www.rockysahoo.space/",
    "name": "Sarthak Sahoo, Product Designer",
    "url": "https://www.rockysahoo.space/"
  }
}
</script>

<!-- ==========================================================================
     THE LINK, WHEN SOMEBODY ELSE POSTS IT, AND WHY IT IS THE FIRST THING HERE

     This file is one 8MB document. A social crawler does not read 8MB: it
     opens the connection, takes the first slice of the response (LinkedIn's
     is famously small) looks for the tags and gives up. Everything below
     this block is embedded fonts, an inline stylesheet and inline script, any
     one of which is larger than that slice on its own. So the metadata goes
     FIRST, before a single byte of payload, and a crawler that reads only the
     opening of the document has already read all of it.

     `<meta charset>` stays ahead of it, and only it. The spec wants the
     encoding declared in the first 1024 bytes, and the title below contains an
     em dash, declare the charset after that and a crawler is entitled to
     decode it as mojibake. Twenty-two bytes is not what LinkedIn is choking
     on.

     Static HTML, in the document as served. Nothing here is written by script,
     because a crawler does not run script. A tag injected at runtime is a tag
     that exists for browsers and for nobody else.

     One canonical set. Open Graph is what LinkedIn, Facebook, iMessage, Slack
     and Discord read; the twitter:* tags are what X needs for a large card.
     Absolute HTTPS on every URL, because a crawler fetching this from its own
     server has no page to resolve a relative path against.

     Two files must sit at the repo root beside index.html: social-preview-v2.png,
     which og:image names, and CNAME, which is what tells GitHub Pages to
     answer on www.rockysahoo.space at all.
     ========================================================================== -->

<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- THE OLD FRAGMENT STILL GOES SOMEWHERE.

     #/slop was the address of this project for as long as the site had no
     page to give it. Anything already pointing there - a message, a bookmark,
     a link in a profile - is sent on to the real path rather than left to
     resolve into the index. replace(), not assign(), so the fragment does not
     become a step in the reader's history to go back through. Inline and
     first, so it happens before a frame is painted. -->
<script>
  (function () {
    if (location.hash === '#/slop' || location.hash === '#/slop/') {
      location.replace('/slop/');
    }
  })();
</script>
<meta name="theme-color" content="#0A0A0B">
<!-- VFINAL THEME, BEFORE FIRST PAINT. Dark on every load (owner, 2026-11-23; replaces 2026-11-21's persisted choice):
     every fresh visit and every refresh opens dark, whatever the OS prefers. The toggle's choice lives in
     sessionStorage['vf-theme'] and is honoured only on the site's own internal reloads (route changes, the toggle,
     range changes - flagged by sessionStorage['vf-internal'] in assets/vf/app.js), so it holds while browsing and a
     new load starts dark again. Set here, before any board or stylesheet paints: no light frame, no layout shift. -->
<script>
  (function () {
    var t = 'dark';
    /* VFINAL keeps its theme under its own key. 'pf-theme' belongs to the previous site, whose original code still runs
       inside the live project previews and reads it: left set, those originals would switch to their own dark theme
       (and an opaque frame) instead of the state the approved boards show. It is retired here. */
    try { if (sessionStorage.getItem('vf-internal') === '1' && sessionStorage.getItem('vf-theme') === 'light') t = 'light';
      localStorage.removeItem('vf-theme'); /* the retired persistent choice */ localStorage.removeItem('pf-theme'); } catch (e) {}
    /* data-vf-theme, not data-theme: the live project previews run the previous site's code, which follows its host
       page's data-theme. On the approved boards their host had none, so they show their own default state. */
    document.documentElement.setAttribute('data-vf-theme', t);
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', t === 'dark' ? '#0A0A0B' : '#EEECE7');
    if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  })();
</script>

   - Display (--vf-fs-h2: "The short version", Craigslist / SBL chapter heads): quieter, 46 -> 32px at 1440.
   - Chapter (--vf-fs-title, .ar-h2 / the narrative section titles): a step above the supporting tier.
   - Supporting (--vf-fs-sub, new): step, demo, task, glossary, journey titles - eleven roles that all read as chapter
     headlines at 24px now read as what they are.
   - Lede and body: readable, not loud. Captions / meta unchanged (14-15px, sentence case).
   Spacing: a chapter's lead paragraph binds to the content it introduces (80px -> ~40px); the transition into the next
   chapter gets the room instead; a supporting heading sits closer to its paragraph than to what came before. */
@media (min-width:1024px){
  /* heading tokens feed 'VF2 Display' (Inter at size-adjust 78%), so their rendered size is 0.78x the token:
     h1 ~52px, display ~28, chapter ~24, supporting ~18.5 - all above the 16-17px Inter body. Maxima are reached by
     ~1700px and held: a wider screen adds space around the reading column, not larger type (owner, 2026-11-23). */
  /* second step (owner, 2026-11-23, "smaller, more negative space"): primary -9%, display / chapter -12 to -15%,
     supporting -5% (it already sat close to body), lede -5%; body unchanged (sustained reading). At 1440 rendered:
     h1 ~47 / display ~25 / chapter ~21 / supporting ~18 / lede 17 / body 16. */
  #vf .root{--vf-fs-d2:clamp(52px,4.2vw,72px);--vf-fs-h2:clamp(30px,2.2vw,38px);--vf-fs-title:clamp(24px,1.9vw,30px);
    --vf-fs-sub:clamp(21px,1.6vw,24px);--vf-fs-lede:clamp(17px,1.2vw,19px);--vf-fs-body:clamp(16px,calc(.12vw + 14.3px),17px)}
  #vf .root .cs5 :is(.ar-h3,.demo__h,.tk__t,.us__h,.gloss__h),#vf .vf-jr-t{font-size:var(--vf-fs-sub)!important;line-height:1.3!important}
  #vf .root .cs5 :is(.ar-h3,.demo__h,.us__h,.gloss__h){margin-bottom:.5em!important}
  #vf .root .cs5 .cs-beat[data-phase-anchor]{margin-top:clamp(104px,8vw,168px)!important}
  #vf .root .cs5 .cs-beat + *{margin-top:clamp(32px,2.6vw,52px)!important}
  #vf .vf-jr-h{font-size:var(--vf-fs-h2)}
  /* the impact figure is evidence, not a second title: display tier x1.3 (64 -> ~41px at 1440) */
  #vf .root .cs5 .bim__val,#vf .root .met dd{font-size:calc(var(--vf-fs-h2) * 1.3)!important;line-height:1.05!important}
}
